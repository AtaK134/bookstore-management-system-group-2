{% extends "base.html" %}
{% block title %}{{ ('Add ' if is_new else 'Edit ') ~ cfg.label|lower }}{% endblock %}
{% block content %}
<div class="card form-card">
  <h1>{{ 'Add' if is_new else 'Edit' }} {{ cfg.label|lower }}</h1>
  <form method="post">
    {{ csrf_field() }}
    {% for column, label, required, type in cfg.fields %}
      <label>{{ label }}{% if required %} *{% endif %}
        <input name="{{ column }}" type="{{ type }}" value="{{ values[column] or '' }}" {% if required %}required{% endif %}>
      </label>
    {% endfor %}
    <div class="actions">
      <a class="btn btn-ghost" href="{{ url_for('admin_entity_list', entity=entity) }}">Cancel</a>
      <button class="btn">Save</button>
    </div>
  </form>
</div>
{% endblock %}
