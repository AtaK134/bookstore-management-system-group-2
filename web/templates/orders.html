{% extends "base.html" %}
{% block title %}My orders{% endblock %}
{% block content %}
<h1>My orders</h1>
{% if not sales %}
  <p class="muted">You have no orders yet.</p>
{% endif %}
{% for s in sales %}
  {% include "_sale.html" %}
  <form method="post" action="{{ url_for('cancel_order', sale_id=s.sale_id) }}" class="sale-action"
        onsubmit="return confirm('Cancel order #{{ s.sale_id }}?');">
    {{ csrf_field() }}
    <button class="btn btn-small btn-danger">Cancel order</button>
  </form>
{% endfor %}
{% endblock %}
