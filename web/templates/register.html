{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Create a customer account</h1>
  <form method="post">
    {{ csrf_field() }}
    <div class="grid-2">
      <label>First name * <input name="first_name" value="{{ form.first_name }}" required maxlength="50"></label>
      <label>Last name * <input name="last_name" value="{{ form.last_name }}" required maxlength="50"></label>
    </div>
    <label>E-mail * <input name="email" type="email" value="{{ form.email }}" required maxlength="100"></label>
    <label>Phone <input name="phone" value="{{ form.phone }}" maxlength="20"></label>
    <label>Username * <input name="username" value="{{ form.username }}" required maxlength="50" autocomplete="username"></label>
    <label>Password * (at least 8 characters)
      <input name="password" type="password" required minlength="8" autocomplete="new-password"></label>
    <button class="btn">Register</button>
  </form>
</div>
{% endblock %}
