# Bookstore PostgreSQL (Docker)
# Başlat:   docker compose up -d
# Durdur:   docker compose down
# Sıfırla:  docker compose down -v   (veriyi siler; tekrar up dendiğinde schema.sql + data.sql yeniden çalışır)
#
# Bilgiler .env dosyasından okunur. Bilgisayarda kurulu PostgreSQL 5432'yi kullandığı
# için konteyner varsayılan olarak 5434 portundan açılır (DOCKER_DB_PORT).

services:
  db:
    image: postgres:18
    container_name: bookstore-db
    restart: "no"   # otomatik başlamaz; sadece "docker compose up -d" ile açılır
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DOCKER_DB_PORT:-5434}:5432"
    volumes:
      - bookstore_data:/var/lib/postgresql
      # Veritabanı ilk kez oluşturulurken alfabetik sırayla çalışır
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bookstore_data:
